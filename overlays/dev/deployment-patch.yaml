apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: broker-mqtt-acme
spec:
  replicas: 1
  template:
    spec:
      containers:
      - name: mosquitto
        resources:
          requests:
            memory: "32Mi"
            cpu: "25m"
          limits:
            memory: "64Mi"
            cpu: "50m"