apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: broker-mqtt-acme
spec:
  replicas: 2
  template:
    spec:
      containers:
      - name: mosquitto
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"