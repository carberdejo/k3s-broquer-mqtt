apiVersion: v1
kind: Service
metadata:
  name: mosquitto-service
  namespace: broker-mqtt-acme
spec:
  type: NodePort
  ports:
  - port: 1883
    targetPort: 1883
    protocol: TCP
    name: mqtt
  - port: 9002
    targetPort: 9002
    protocol: TCP
    name: websockets
  - port: 8883
    targetPort: 8883
    protocol: TCP
    name: mqtts