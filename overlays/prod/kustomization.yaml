apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: mosquitto-prod
  annotations:
    config.kubernetes.io/local-config: "true"

namePrefix: prod-

resources:
  - ../../base
  - ingress.yaml
  - hpa.yaml

patches:
  - path: deployment-patch.yaml
  - path: service-patch.yaml